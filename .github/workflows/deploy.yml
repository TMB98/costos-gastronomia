name: Publicar en GitHub Pages

# Corre en dos casos:
# - Pull Request contra "main": corre los tests y el build, PERO NO publica
#   nada — es el chequeo que tiene que salir verde antes de poder mergear.
# - Push directo a "main" (o después de mergear un PR): corre todo Y además
#   publica en GitHub Pages.
# Nada de esto corre en tu compu — todo pasa en los servidores de GitHub.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: # también te deja apretar "Run workflow" a mano desde la web si querés

# Permisos que necesita el robot para poder publicar en Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # jsdom 30 (usado por los tests) necesita Node 22+; con Node 20 los tests no arrancan
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Correr los tests (si algo está roto, no se sigue con el deploy)
        run: npm test

      - name: Compilar (npm run build)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      - name: Preparar lo compilado para publicar
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    # Solo publica en un push real a main (o "Run workflow" manual) — nunca
    # en un Pull Request todavía sin mergear, para no pisar producción con
    # un cambio que no se terminó de aprobar.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
